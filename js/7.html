<div style="display:flex; gap:20px">
  <div class="col" id="todo"><h3>To Do</h3>
    <div class="card" id="t1" draggable="true">
      task 1
    </div>
    <div class="card" id="t2" draggable="true">
      task2
    </div>
  </div>
  <div class="col" id="prog">
    <h3>In Progress</h3>
  </div>
  <div class="col" id="done">
    <h3>Done</h3>
  </div>
</div>

<style>
  .col{flex:1;min-height:200px;padding:10px;background:#f4f4f4;}
  .card{padding:10px; margin-bottom:10px; border: 1px solid black;}
</style>

<script>
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('dragstart',e=>e.dataTransfer.setData('text',card.id));
  });

  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover', e => e.preventDefault());
    col.addEventListener('drop', e => {
      e.preventDefault();
      card = document.getElementById(e.dataTransfer.getData('text'));
      col.appendChild(card);
      card.dataset.status = col.id;
    });
  });
</script>
